<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>4DV806 A3 — Heart Disease Multivariate Dashboard (D3.js)</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Heart Disease Multivariate Dashboard</h1>
      <p>GR222HD</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="main-layout">
        <!-- Controls on the left -->
        <div id="controls"></div>
        
        <!-- Visualizations on the right -->
        <div id="vis">
          <div id="row1" class="vis-row">
            <div id="outcome-chart" class="chart"></div>
            <div id="filter-status" class="chart"></div>
          </div>
          
          <div id="row2" class="vis-row">
            <div id="small-multiples" class="chart">
              <div id="hist-age" class="histogram"></div>
              <div id="hist-trestbps" class="histogram"></div>
              <div id="hist-chol" class="histogram"></div>
              <div id="hist-thalach" class="histogram"></div>
            </div>
            <div id="scatter-chart" class="chart"></div>
          </div>
          
          <div id="row3" class="vis-row">
            <div id="patient-details" class="chart"></div>
          </div>
        </div>
      </div>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
